<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Web Services — Sakshi Madgundi</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #000;
            overflow: hidden;
        }

        .splash {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #000;

            z-index: 99999;

            animation: fadeOut 0.6s ease forwards;
            animation-delay: 4.4s;
        }

        .splash img {
            width: min(520px, 78vw);
            height: auto;

            display: block;

            object-fit: contain;

            animation: logoIn 0.8s ease-out;
        }

        @keyframes logoIn {
            from {
                opacity: 0;
                transform: scale(0.92);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        @media (max-width: 600px) {
            .splash img {
                width: 82vw;
            }
        }
    </style>
</head>

<body>

    <div class="splash">

        <img
            src="logo.png"
            alt="Web Services — Sakshi Madgundi"
        >

    </div>

    <script>
        setTimeout(function () {

            window.location.replace("index.html");

        }, 5000);
    </script>

</body>
</html>
