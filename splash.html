<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Web Services — Sakshi Madgundi</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #000000;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .splash-screen {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            background: #000000;

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 99999;

            animation: splashFadeOut 0.6s ease forwards;

            animation-delay: 4.4s;
        }

        .splash-logo {
            width: min(520px, 78vw);
            height: auto;

            display: block;

            object-fit: contain;

            animation: logoAppear 0.8s ease-out;
        }

        @keyframes logoAppear {
            0% {
                opacity: 0;
                transform: scale(0.92);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes splashFadeOut {
            0% {
                opacity: 1;
                visibility: visible;
            }

            100% {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }
        }

        @media (max-width: 600px) {
            .splash-logo {
                width: 82vw;
            }
        }
    </style>
</head>

<body>

    <div class="splash-screen" id="splashScreen">

        <img
            src="logo.png"
            alt="Web Services — Sakshi Madgundi"
            class="splash-logo"
        >

    </div>

    <script>
        setTimeout(function () {
            const splash = document.getElementById("splashScreen");

            if (splash) {
                splash.remove();
            }
        }, 5000);
    </script>

</body>
</html>
