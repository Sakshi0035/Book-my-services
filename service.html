<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Service — Sakshi Madgundi
    </title>


    <style>

        :root {

            --yellow: #ffd21f;
            --yellow-soft: #fff5a8;

            --orange: #ff9f1c;
            --orange-dark: #ef7900;

            --bg: #ffffff;
            --surface: #ffffff;
            --surface-soft: #f7f7f7;

            --text: #111111;
            --muted: #666666;

            --border: #e8e8e8;

        }


        body.dark {

            --bg: #080808;
            --surface: #111111;
            --surface-soft: #181818;

            --text: #ffffff;
            --muted: #aaaaaa;

            --border: #292929;

        }


        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }


        body {

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                var(--bg);

            color:
                var(--text);

            transition:
                .25s ease;

        }


        a {

            color:
                inherit;

            text-decoration:
                none;

        }


        button {

            font: inherit;

            cursor:
                pointer;

        }


        /* =====================================================
           HEADER
           ===================================================== */

        header {

            position:
                sticky;

            top:
                0;

            z-index:
                1000;

            height:
                72px;

            background:
                var(--surface);

            border-bottom:
                1px solid
                var(--border);

        }


        .header-inner {

            width:
                min(
                    1180px,
                    calc(
                        100% - 32px
                    )
                );

            height:
                100%;

            margin:
                auto;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

        }


        .logo {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

            font-weight:
                800;

        }


        .logo-box {

            width:
                38px;

            height:
                38px;

            display:
                grid;

            place-items:
                center;

            background:
                var(--yellow);

            color:
                #111;

            border-radius:
                11px;

            font-weight:
                900;

        }


        .logo span:last-child span {

            color:
                var(--orange-dark);

        }


        .back {

            padding:
                10px 15px;

            border:
                1px solid
                var(--border);

            border-radius:
                10px;

            color:
                var(--muted);

            font-size:
                13px;

            font-weight:
                700;

        }


        .back:hover {

            background:
                var(--yellow);

            color:
                #111;

            border-color:
                var(--yellow);

        }


        /* =====================================================
           SERVICE PAGE
           ===================================================== */

        main {

            width:
                min(
                    1050px,
                    calc(
                        100% - 32px
                    )
                );

            margin:
                auto;

            padding:
                55px 0 80px;

        }


        .breadcrumb {

            margin-bottom:
                25px;

            color:
                var(--muted);

            font-size:
                12px;

        }


        .product {

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                45px;

            align-items:
                start;

        }


        /* IMAGE */

        .product-image {

            min-height:
                450px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            background:
                linear-gradient(
                    135deg,
                    var(--yellow),
                    var(--orange)
                );

            border-radius:
                22px;

            overflow:
                hidden;

        }


        .product-image-inner {

            font-size:
                60px;

            font-weight:
                900;

            color:
                #111;

        }


        /* CONTENT */

        .product-category {

            color:
                var(--orange-dark);

            font-size:
                11px;

            font-weight:
                900;

            text-transform:
                uppercase;

            letter-spacing:
                .8px;

            margin-bottom:
                10px;

        }


        .product-title {

            font-size:
                clamp(
                    32px,
                    5vw,
                    48px
                );

            line-height:
                1.05;

            letter-spacing:
                -1.5px;

            margin-bottom:
                15px;

        }


        .product-description {

            color:
                var(--muted);

            font-size:
                15px;

            line-height:
                1.7;

            margin-bottom:
                22px;

        }


        .product-price-label {

            color:
                var(--muted);

            font-size:
                11px;

        }


        .product-price {

            font-size:
                27px;

            font-weight:
                900;

            margin:
                3px 0 22px;

        }


        .included {

            padding:
                20px;

            background:
                var(--surface-soft);

            border:
                1px solid
                var(--border);

            border-radius:
                15px;

            margin-bottom:
                22px;

        }


        .included h3 {

            font-size:
                15px;

            margin-bottom:
                12px;

        }


        .included ul {

            list-style:
                none;

            display:
                flex;

            flex-direction:
                column;

            gap:
                9px;

        }


        .included li {

            color:
                var(--muted);

            font-size:
                13px;

        }


        .included li::before {

            content:
                "✓";

            color:
                var(--orange-dark);

            font-weight:
                900;

            margin-right:
                8px;

        }


        .book-large {

            width:
                100%;

            padding:
                15px 20px;

            background:
                var(--yellow);

            color:
                #111;

            border:
                0;

            border-radius:
                12px;

            font-size:
                14px;

            font-weight:
                900;

        }


        .book-large:hover {

            background:
                var(--orange);

        }


        /* =====================================================
           QR
           ===================================================== */

        .qr-overlay {

            position:
                fixed;

            inset:
                0;

            z-index:
                5000;

            display:
                none;

            align-items:
                center;

            justify-content:
                center;

            padding:
                20px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    .72
                );

            backdrop-filter:
                blur(5px);

        }


        .qr-overlay.open {

            display:
                flex;

        }


        .qr-modal {

            width:
                min(
                    420px,
                    100%
                );

            padding:
                22px;

            background:
                var(--surface);

            border:
                1px solid
                var(--border);

            border-radius:
                22px;

            text-align:
                center;

        }


        .qr-close {

            width:
                36px;

            height:
                36px;

            display:
                grid;

            place-items:
                center;

            margin-left:
                auto;

            margin-bottom:
                5px;

            border:
                0;

            border-radius:
                50%;

            background:
                var(--surface-soft);

            color:
                var(--text);

            font-size:
                20px;

        }


        .qr-modal h2 {

            font-size:
                23px;

            margin-bottom:
                7px;

        }


        .qr-subtitle {

            color:
                var(--muted);

            font-size:
                13px;

            margin-bottom:
                15px;

        }


        .qr-box {

            width:
                270px;

            height:
                270px;

            max-width:
                76vw;

            max-height:
                76vw;

            margin:
                auto auto 16px;

            padding:
                5px;

            background:
                #fff;

            border:
                4px solid
                var(--yellow);

            border-radius:
                15px;

        }


        .qr-box img {

            width:
                100%;

            height:
                100%;

            object-fit:
                contain;

        }


        .qr-note {

            padding:
                11px;

            background:
                var(--surface-soft);

            border-radius:
                10px;

            color:
                var(--muted);

            font-size:
                11px;

            line-height:
                1.5;

        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 750px) {

            header {
                height: 64px;
            }

            .header-inner {

                width:
                    calc(
                        100% - 22px
                    );

            }

            main {

                width:
                    calc(
                        100% - 22px
                    );

                padding-top:
                    30px;

            }

            .product {

                grid-template-columns:
                    1fr;

                gap:
                    25px;

            }

            .product-image {

                min-height:
                    280px;

            }

            .product-title {

                font-size:
                    34px;

            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header>

        <div class="header-inner">

            <a
                href="index.html"
                class="logo"
            >

                <span class="logo-box">
                    S
                </span>

                <span>
                    Sakshi
                    <span>Madgundi</span>
                </span>

            </a>


            <a
                href="index.html"
                class="back"
            >
                ← All Services
            </a>

        </div>

    </header>


    <!-- SERVICE PRODUCT -->

    <main>

        <div class="breadcrumb">

            Services
            /
            <span id="breadcrumbName">
                Service
            </span>

        </div>


        <section class="product">


            <!-- PRODUCT IMAGE -->

            <div class="product-image">

                <div
                    class="product-image-inner"
                    id="productIcon"
                >
                    WEB
                </div>

            </div>


            <!-- PRODUCT INFORMATION -->

            <div>

                <div
                    class="product-category"
                    id="productCategory"
                >
                    WEB SERVICE
                </div>


                <h1
                    class="product-title"
                    id="productTitle"
                >
                    Service
                </h1>


                <p
                    class="product-description"
                    id="productDescription"
                >
                    Service description.
                </p>


                <span class="product-price-label">
                    Service price
                </span>


                <div
                    class="product-price"
                    id="productPrice"
                >
                    ₹0
                </div>


                <div class="included">

                    <h3>
                        What's included
                    </h3>


                    <ul id="productFeatures">

                    </ul>

                </div>


                <!-- BOOK -->

                <button
                    type="button"
                    class="book-large"
                    id="bookButton"
                >
                    Book This Service
                </button>

            </div>

        </section>

    </main>


    <!-- =========================================================
         QR MODAL
         ========================================================= -->

    <div
        class="qr-overlay"
        id="qrOverlay"
    >

        <div class="qr-modal">

            <button
                type="button"
                class="qr-close"
                id="qrClose"
            >
                ×
            </button>


            <h2>
                Book This Service
            </h2>


            <p class="qr-subtitle">
                Scan the QR code below to make the payment.
            </p>


            <div
                class="qr-box"
            >

                <img
                    src="kotak-qr.png"
                    alt="Kotak payment QR code"
                >

            </div>


            <div class="qr-note">

                After payment, contact Sakshi Madgundi
                with your payment confirmation and
                service requirements.

            </div>

        </div>

    </div>


    <script>

        /* =====================================================
           SERVICE DATABASE
           ===================================================== */

        const services = {

            "wordpress-fix": {

                name:
                    "WordPress Issue Fix",

                category:
                    "WordPress",

                price:
                    "₹199 – ₹599",

                icon:
                    "WP",

                description:
                    "Fix a specific WordPress or WooCommerce issue on your existing website.",

                features: [

                    "One specific website issue",

                    "Theme or plugin related issues",

                    "Basic troubleshooting",

                    "Responsive checking where required"

                ]

            },


            "header-menu": {

                name:
                    "Header / Menu Fix",

                category:
                    "WordPress",

                price:
                    "₹199 – ₹599",

                icon:
                    "☰",

                description:
                    "Fix navigation, headers, mobile menus, spacing and responsive layout problems.",

                features: [

                    "Desktop navigation fixes",

                    "Mobile menu fixes",

                    "Header spacing adjustments",

                    "Responsive layout corrections"

                ]

            },


            "design-to-website": {

                name:
                    "Design → Website",

                category:
                    "Web Design",

                price:
                    "₹1,500 – ₹3,000",

                icon:
                    "✦",

                description:
                    "Turn an existing design into a responsive working website.",

                features: [

                    "HTML / CSS implementation",

                    "Responsive design",

                    "Design matching",

                    "Basic JavaScript functionality"

                ]

            },


            "complete-website": {

                name:
                    "Complete Website",

                category:
                    "Website",

                price:
                    "₹6,666 – ₹9,999",

                icon:
                    "WEB",

                description:
                    "A complete basic website built according to the client's requirements.",

                features: [

                    "Website pages and sections",

                    "Responsive desktop and mobile design",

                    "Basic website functionality",

                    "Deployment-ready files"

                ]

            },


            "woocommerce": {

                name:
                    "WooCommerce Setup / Fix",

                category:
                    "WooCommerce",

                price:
                    "₹999+",

                icon:
                    "🛒",

                description:
                    "WooCommerce product, cart, checkout and basic store functionality setup or fixes.",

                features: [

                    "Product setup",

                    "Cart functionality",

                    "Basic checkout fixes",

                    "WooCommerce configuration"

                ]

            },


            "custom-website": {

                name:
                    "Custom Website Work",

                category:
                    "Custom Website",

                price:
                    "₹1,500+",

                icon:
                    "✎",

                description:
                    "Custom website work based on the exact requirements of your project.",

                features: [

                    "Custom UI implementation",

                    "Responsive website",

                    "Requirement-based development",

                    "Custom functionality where applicable"

                ]

            }

        };


        /* =====================================================
           GET SERVICE FROM URL
           ===================================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const serviceKey =
            params.get("service");


        const service =
            services[serviceKey];


        /* =====================================================
           LOAD SERVICE
           ===================================================== */

        if (service) {

            document.title =
                service.name +
                " — Sakshi Madgundi";


            document.getElementById(
                "breadcrumbName"
            ).textContent =
                service.name;


            document.getElementById(
                "productCategory"
            ).textContent =
                service.category;


            document.getElementById(
                "productTitle"
            ).textContent =
                service.name;


            document.getElementById(
                "productDescription"
            ).textContent =
                service.description;


            document.getElementById(
                "productPrice"
            ).textContent =
                service.price;


            document.getElementById(
                "productIcon"
            ).textContent =
                service.icon;


            const featureList =
                document.getElementById(
                    "productFeatures"
                );


            featureList.innerHTML = "";


            service.features.forEach(
                function (feature) {

                    const li =
                        document.createElement(
                            "li"
                        );

                    li.textContent =
                        feature;

                    featureList.appendChild(
                        li
                    );

                }
            );

        }


        /* =====================================================
           BOOKING
           ===================================================== */

        const qrOverlay =
            document.getElementById(
                "qrOverlay"
            );


        const bookButton =
            document.getElementById(
                "bookButton"
            );


        const qrClose =
            document.getElementById(
                "qrClose"
            );


        bookButton.addEventListener(
            "click",
            function () {

                qrOverlay.classList.add(
                    "open"
                );

                document.body.style.overflow =
                    "hidden";

            }
        );


        qrClose.addEventListener(
            "click",
            function () {

                qrOverlay.classList.remove(
                    "open"
                );

                document.body.style.overflow =
                    "";

            }
        );


        qrOverlay.addEventListener(
            "click",
            function (event) {

                if (
                    event.target ===
                    qrOverlay
                ) {

                    qrOverlay.classList.remove(
                        "open"
                    );

                    document.body.style.overflow =
                        "";

                }

            }
        );


        /* =====================================================
           THEME
           ===================================================== */

        const savedTheme =
            localStorage.getItem(
                "sakshi-theme"
            );


        if (
            savedTheme ===
            "dark"
        ) {

            document.body.classList.add(
                "dark"
            );

        }

    </script>

</body>

</html>
